name: CI Build y Pruebas

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17 y cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build sin pruebas
        run: >-
          mvn -B clean package
          -DskipUnitTests=true
          -DskipIntegrationTests=true
          -DskipAcceptanceTests=true

      - name: Pruebas unitarias
        run: mvn -B test

      - name: Pruebas de integracion
        run: mvn -B verify -DskipUnitTests=true

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/
